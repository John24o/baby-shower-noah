<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Baby Shower · Noah Nicolás</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Montserrat',sans-serif;color:#fff;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:24px;
  background:
    radial-gradient(ellipse at 20% 0%,#3DE0F0 0%,transparent 55%),
    radial-gradient(ellipse at 80% 0%,#22C9E0 0%,transparent 55%),
    radial-gradient(ellipse at 50% 100%,#086478 0%,transparent 60%),
    linear-gradient(180deg,#18C8DC 0%,#0DB4CC 30%,#099ABB 60%,#077890 100%);
  overflow:hidden;position:relative;
}
.bubble{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.55),rgba(255,255,255,.08) 60%,transparent);
  border:1px solid rgba(255,255,255,.25);pointer-events:none;
  animation:rise 14s linear infinite;bottom:-40px;
}
@keyframes rise{
  0%{transform:translateY(0) translateX(0);opacity:.7}
  40%{opacity:.55}
  100%{transform:translateY(-110vh) translateX(-8px);opacity:0}
}
.card{
  background:rgba(2,60,85,.45);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.25);border-radius:24px;
  padding:48px 32px;
  box-shadow:0 8px 48px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.15);
  max-width:440px;width:100%;text-align:center;position:relative;z-index:10;
}
.emoji{font-size:3rem;margin-bottom:14px;animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.label{font-size:.65rem;letter-spacing:.28rem;text-transform:uppercase;opacity:.75;margin-bottom:14px}
.name{
  font-size:3rem;font-family:'Dancing Script',cursive;line-height:1.1;
  color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.35);margin-bottom:6px;
}
.script{font-family:'Dancing Script',cursive;font-size:1.5rem;color:#B2EEF4;margin-top:6px}
.line{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);margin:22px auto;max-width:200px}
.verse{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.15rem;line-height:1.75;font-weight:300;margin:18px 0}
.small{font-size:.78rem;letter-spacing:.05rem;opacity:.75;margin-top:14px}
.heart{color:#FF7B6E;font-style:normal}
@media(max-width:420px){
  .card{padding:38px 22px}
  .name{font-size:2.4rem}
  .emoji{font-size:2.5rem}
  .verse{font-size:1.05rem}
}
</style>
</head>
<body>

<div class="bubble" style="width:14px;height:14px;left:8%;animation-delay:0s"></div>
<div class="bubble" style="width:8px;height:8px;left:22%;animation-delay:3s"></div>
<div class="bubble" style="width:20px;height:20px;left:42%;animation-delay:1.5s"></div>
<div class="bubble" style="width:10px;height:10px;left:62%;animation-delay:5s"></div>
<div class="bubble" style="width:16px;height:16px;left:80%;animation-delay:2.2s"></div>
<div class="bubble" style="width:6px;height:6px;left:90%;animation-delay:7s"></div>
<div class="bubble" style="width:12px;height:12px;left:33%;animation-delay:8.5s"></div>
<div class="bubble" style="width:7px;height:7px;left:55%;animation-delay:10s"></div>

<main class="card">
  <div class="emoji">🐠💙</div>
  <p class="label">Baby Shower</p>
  <h1 class="name">Noah Nicolás</h1>
  <p class="script">¡gracias por venir!</p>

  <div class="line"></div>

  <p class="verse">
    Gracias por celebrar con nosotros.<br/>
    El baby shower ya pasó y nos vamos con<br/>
    el corazón lleno de cariño para Noah.
  </p>

  <div class="line"></div>

  <p class="small">Con amor <span class="heart">♥</span></p>
</main>

</body>
</html>
